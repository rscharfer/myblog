<svg class="seq seq-ed" viewBox="0 0 720 380" role="img" aria-label="Diagram: three Claude sessions and two things they share. The Product session puts decisions into the product spec, a Claude doc; the Implementation session builds from the spec and commits the code to the git repo; the Design review session reads the code in the repo, not the spec."><defs><marker id="ah-tt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ahd"/></marker></defs><g><rect class="head" x="4" y="40" width="170" height="106" rx="0" style="fill:var(--code-bg);stroke:var(--ink);stroke-width:1"/><text x="89.0" y="69.0" text-anchor="middle" style="font:600 10.5px var(--font-body);letter-spacing:.1em;fill:var(--muted)">CLAUDE SESSION</text><text class="lane" x="89.0" y="92.0" text-anchor="middle">Product</text><text x="89.0" y="112.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">what to build,</text><text x="89.0" y="130.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">and in which version</text><rect class="head" x="290" y="40" width="180" height="106" rx="0" style="fill:var(--paper);stroke:var(--link);stroke-width:1.6"/><text x="380.0" y="69.0" text-anchor="middle" style="font:600 10.5px var(--font-body);letter-spacing:.1em;fill:var(--link)">CLAUDE DOC</text><text class="lane" x="380.0" y="92.0" text-anchor="middle">Product spec</text><text x="380.0" y="112.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">scope · decision log</text><text x="380.0" y="130.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">open questions</text><rect class="head" x="576" y="40" width="140" height="106" rx="0" style="fill:var(--code-bg);stroke:var(--ink);stroke-width:1"/><text x="646.0" y="78.0" text-anchor="middle" style="font:600 10.5px var(--font-body);letter-spacing:.1em;fill:var(--muted)">CLAUDE SESSION</text><text class="lane" x="646.0" y="101.0" text-anchor="middle">Implementation</text><text x="646.0" y="121.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">writes the code</text><rect class="head" x="576" y="268" width="140" height="106" rx="0" style="fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:5 4"/><text x="646.0" y="306.0" text-anchor="middle" style="font:600 10.5px var(--font-body);letter-spacing:.1em;fill:var(--muted)">GIT REPO</text><text x="646.0" y="329.0" text-anchor="middle" style="font:500 15px var(--font-mono);fill:var(--ink)">repo/</text><text x="646.0" y="349.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">the code itself</text><rect class="head" x="290" y="268" width="180" height="106" rx="0" style="fill:var(--code-bg);stroke:var(--ink);stroke-width:1"/><text x="380.0" y="297.0" text-anchor="middle" style="font:600 10.5px var(--font-body);letter-spacing:.1em;fill:var(--muted)">CLAUDE SESSION</text><text class="lane" x="380.0" y="320.0" text-anchor="middle">Design review</text><text x="380.0" y="340.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">explains the code;</text><text x="380.0" y="358.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">I push back</text><path class="arrow back" d="M176 93 L284 93" marker-end="url(#ah-tt)"/><text class="lbl" x="230" y="83" text-anchor="middle" style="font-size:15px">decisions go in</text><path class="arrow back" d="M472 93 L570 93" marker-end="url(#ah-tt)"/><text class="lbl" x="523" y="83" text-anchor="middle" style="font-size:15px">builds from</text><path class="arrow back" d="M646 148 L646 262" marker-end="url(#ah-tt)"/><text class="lbl" x="634" y="210" text-anchor="end" style="font-size:15px">commits</text><path class="arrow back" d="M574 321 L476 321" marker-end="url(#ah-tt)"/><text class="lbl" x="525" y="311" text-anchor="middle" style="font-size:15px">reads</text></g></svg>
