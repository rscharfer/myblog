<svg class="seq seq-ed seq-narrow" viewBox="0 0 340 612" role="img" aria-label="An excerpt of the product spec's decision log: each decision with its date and the reason for it."><defs><marker id="ah-ps-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ahd"/></marker></defs><g><rect class="note" x="1" y="1" width="338" height="610" rx="0" style="fill:var(--paper);stroke:var(--rule)"/><text x="16" y="34" text-anchor="start" style="font:600 18px var(--font-display);fill:var(--ink)">Thankful: Product Spec</text><text x="16" y="56" text-anchor="start" style="font:13px var(--font-body);fill:var(--muted)">Shared by all three threads</text><path d="M16 72 H324" style="stroke:var(--rule);stroke-width:1;fill:none"/><text x="16" y="98" text-anchor="start" style="font:600 11px var(--font-body);letter-spacing:.1em;fill:var(--link)">DECISION LOG</text><text x="16" y="118" text-anchor="start" style="font:italic 12px var(--font-body);fill:var(--muted)">Add a row whenever something is decided.</text><text x="16" y="148" text-anchor="start" style="font:500 13px var(--font-body);fill:var(--link)">Oct 18</text><text x="16" y="167" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">The record screen gets its result through</text><text x="16" y="185" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">Supabase Realtime instead of polling</text><text x="16" y="203" text-anchor="start" style="font:italic 13px var(--font-body);fill:var(--muted)">Why: My call: an instant confirmation without</text><text x="16" y="220" text-anchor="start" style="font:italic 13px var(--font-body);fill:var(--muted)">polling</text><path d="M16 243 H324" style="stroke:var(--rule);stroke-width:1;fill:none"/><text x="16" y="265" text-anchor="start" style="font:500 13px var(--font-body);fill:var(--link)">Oct 18</text><text x="16" y="284" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">Note processing runs in a Supabase Edge</text><text x="16" y="302" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">Function</text><text x="16" y="320" text-anchor="start" style="font:italic 13px var(--font-body);fill:var(--muted)">Why: Netlify's plan stops functions at about</text><text x="16" y="337" text-anchor="start" style="font:italic 13px var(--font-body);fill:var(--muted)">10 s; a note takes about 12 s</text><path d="M16 360 H324" style="stroke:var(--rule);stroke-width:1;fill:none"/><text x="16" y="382" text-anchor="start" style="font:500 13px var(--font-body);fill:var(--link)">Sep 29</text><text x="16" y="401" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">Summaries use JSON outputs instead of a</text><text x="16" y="419" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">record_day tool</text><text x="16" y="437" text-anchor="start" style="font:italic 13px var(--font-body);fill:var(--muted)">Why: Opus rejected a forced tool call, and a</text><text x="16" y="454" text-anchor="start" style="font:italic 13px var(--font-body);fill:var(--muted)">summary needs no tool decision</text><path d="M16 477 H324" style="stroke:var(--rule);stroke-width:1;fill:none"/><text x="16" y="499" text-anchor="start" style="font:500 13px var(--font-body);fill:var(--link)">Sep 25</text><text x="16" y="518" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">Summaries never say you or your; our, we and</text><text x="16" y="536" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">us are fine</text><text x="16" y="554" text-anchor="start" style="font:italic 13px var(--font-body);fill:var(--muted)">Why: Both of us read the app, so “Your 15K”</text><text x="16" y="571" text-anchor="start" style="font:italic 13px var(--font-body);fill:var(--muted)">only made sense to Franzi</text><path d="M16 594 H324" style="stroke:var(--rule);stroke-width:1;fill:none"/></g></svg>
