<svg class="seq seq-ed" viewBox="0 0 720 500" role="img" aria-label="An excerpt of the product spec the three threads shared: its scope lists and the first rows of its decision log, each decision with its date and the reason for it."><defs><marker id="ah-ps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ahd"/></marker></defs><g><rect class="note" x="1" y="1" width="718" height="498" rx="0" style="fill:var(--paper);stroke:var(--rule)"/><text x="28" y="44" text-anchor="start" style="font:600 21px var(--font-display);fill:var(--ink)">Thankful: Product Spec</text><text x="28" y="68" text-anchor="start" style="font:13px var(--font-body);fill:var(--muted)">A living doc, shared by all three threads · as of Oct 19, 2026</text><path d="M28 88 H692" style="stroke:var(--rule);stroke-width:1;fill:none"/><text x="28" y="116" text-anchor="start" style="font:600 11px var(--font-body);letter-spacing:.1em;fill:var(--link)">SCOPE</text><text x="28" y="142" text-anchor="start" style="font:600 15px var(--font-body);fill:var(--ink)">In v1</text><text x="40" y="162" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">• Calendar</text><text x="40" y="180" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">• Timeline</text><text x="40" y="198" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">• On this day</text><text x="28" y="226" text-anchor="start" style="font:600 15px var(--font-body);fill:var(--ink)">In v2</text><text x="40" y="246" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">• Record in the app</text><text x="40" y="264" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">• Push + unread badge</text><text x="40" y="282" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">• Processing off my Mac</text><text x="28" y="310" text-anchor="start" style="font:600 15px var(--font-body);fill:var(--ink)">Back burner</text><text x="40" y="330" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">• Edit items in the app</text><text x="40" y="348" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">• Search</text><text x="40" y="366" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">• Year in gratitude</text><text x="28" y="394" text-anchor="start" style="font:600 15px var(--font-body);fill:var(--ink)">Dropped</text><text x="40" y="414" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">• Printed book with QR codes</text><text x="40" y="432" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">• Laughter detection</text><path d="M232 106 V476" style="stroke:var(--rule);stroke-width:1;fill:none"/><text x="256" y="116" text-anchor="start" style="font:600 11px var(--font-body);letter-spacing:.1em;fill:var(--link)">DECISION LOG</text><text x="256" y="136" text-anchor="start" style="font:italic 12.5px var(--font-body);fill:var(--muted)">Newest first. Add a row whenever something is decided in conversation.</text><text x="256" y="166" text-anchor="start" style="font:500 13px var(--font-body);fill:var(--link)">Oct 18</text><text x="312" y="166" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">The record screen gets its result through Supabase Realtime</text><text x="312" y="184" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">instead of polling</text><text x="312" y="202" text-anchor="start" style="font:italic 13px var(--font-body);fill:var(--muted)">Why: My call: an instant confirmation without polling</text><path d="M256 215 H692" style="stroke:var(--rule);stroke-width:1;fill:none"/><text x="256" y="241" text-anchor="start" style="font:500 13px var(--font-body);fill:var(--link)">Oct 18</text><text x="312" y="241" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">Note processing runs in a Supabase Edge Function</text><text x="312" y="259" text-anchor="start" style="font:italic 13px var(--font-body);fill:var(--muted)">Why: Netlify's plan stops functions at about 10 s; a note takes</text><text x="312" y="276" text-anchor="start" style="font:italic 13px var(--font-body);fill:var(--muted)">about 12 s</text><path d="M256 289 H692" style="stroke:var(--rule);stroke-width:1;fill:none"/><text x="256" y="315" text-anchor="start" style="font:500 13px var(--font-body);fill:var(--link)">Sep 29</text><text x="312" y="315" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">Summaries use JSON outputs instead of a record_day tool</text><text x="312" y="333" text-anchor="start" style="font:italic 13px var(--font-body);fill:var(--muted)">Why: Opus rejected a forced tool call, and a summary needs no</text><text x="312" y="350" text-anchor="start" style="font:italic 13px var(--font-body);fill:var(--muted)">tool decision</text><path d="M256 363 H692" style="stroke:var(--rule);stroke-width:1;fill:none"/><text x="256" y="389" text-anchor="start" style="font:500 13px var(--font-body);fill:var(--link)">Sep 25</text><text x="312" y="389" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">Summaries never say you or your; our, we and us are fine</text><text x="312" y="407" text-anchor="start" style="font:italic 13px var(--font-body);fill:var(--muted)">Why: Both of us read the app, so “Your 15K” only made sense to</text><text x="312" y="424" text-anchor="start" style="font:italic 13px var(--font-body);fill:var(--muted)">Franzi</text><path d="M256 437 H692" style="stroke:var(--rule);stroke-width:1;fill:none"/><text x="256" y="463" text-anchor="start" style="font:500 13px var(--font-body);fill:var(--link)">Sep 24</text><text x="312" y="463" text-anchor="start" style="font:13px var(--font-body);fill:var(--ink)">Build as a vertical slice, starting with one month of notes</text><text x="312" y="481" text-anchor="start" style="font:italic 13px var(--font-body);fill:var(--muted)">Why: Prove every step on ~20 files before scaling to ~45 hours</text><path d="M256 494 H692" style="stroke:var(--rule);stroke-width:1;fill:none"/></g></svg>
