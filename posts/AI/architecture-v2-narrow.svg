<svg class="seq seq-ed seq-narrow" viewBox="0 0 340 1113" role="img" aria-label="System diagram of Thankful's second version, from the phone through Netlify, Supabase Storage, the process-note Edge Function, Whisper and Claude, back to the phone through Realtime, and on to my wife's phone as a push. Notes mark what I changed."><defs><marker id="ah-arch-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ahd"/></marker></defs><g><rect class="head" x="40" y="6" width="260" height="74" rx="0"/><text class="lane" x="170.0" y="30.0" text-anchor="middle" style="font-size:15px">My phone</text><text x="170.0" y="49.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">records; keeps the audio until</text><text x="170.0" y="66.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">the upload succeeds</text><path class="arrow front" d="M170.0 82 L170.0 116" marker-end="url(#ah-arch-n)"/><text x="156.0" y="105.0" text-anchor="middle" style="font:600 13px var(--font-body);fill:var(--link)">1</text><text class="lbl lbl-n" x="182.0" y="105.0" text-anchor="start" style="font-size:13px">signed upload URL</text><rect class="head" x="40" y="120" width="260" height="57" rx="0"/><text class="lane" x="170.0" y="144.5" text-anchor="middle" style="font-size:15px">Netlify</text><text x="170.0" y="163.5" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">upload route</text><path class="arrow front" d="M170.0 179 L170.0 213" marker-end="url(#ah-arch-n)"/><text x="156.0" y="202.0" text-anchor="middle" style="font:600 13px var(--font-body);fill:var(--link)">2</text><text class="lbl lbl-n" x="182.0" y="202.0" text-anchor="start" style="font-size:13px">PUT the audio</text><rect class="head" x="40" y="217" width="260" height="57" rx="0"/><text class="lane" x="170.0" y="241.5" text-anchor="middle" style="font-size:15px">Supabase Storage</text><text x="170.0" y="260.5" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">private bucket</text><path class="arrow front" d="M170.0 276 L170.0 310" marker-end="url(#ah-arch-n)"/><text x="156.0" y="299.0" text-anchor="middle" style="font:600 13px var(--font-body);fill:var(--link)">3</text><text class="lbl lbl-n" x="182.0" y="299.0" text-anchor="start" style="font-size:13px">phone starts it</text><rect class="head" x="40" y="314" width="260" height="57" rx="0"/><text class="lane" x="170.0" y="338.5" text-anchor="middle" style="font-size:15px">Edge Function: process-note</text><text x="170.0" y="357.5" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">claim → transcribe → write up</text><text x="306" y="348" text-anchor="start" style="font:italic 600 14px var(--font-body);fill:var(--link)">b</text><text x="34" y="348" text-anchor="end" style="font:16px var(--font-body);fill:var(--muted)">↻</text><path class="arrow back" d="M110.0 373 L110.0 407" marker-end="url(#ah-arch-n)" marker-start="url(#ah-arch-n)"/><text x="96.0" y="396" text-anchor="middle" style="font:600 13px var(--font-body);fill:var(--link)">4</text><path class="arrow back" d="M230.0 373 L230.0 407" marker-end="url(#ah-arch-n)" marker-start="url(#ah-arch-n)"/><text x="244.0" y="396" text-anchor="middle" style="font:600 13px var(--font-body);fill:var(--link)">5</text><rect class="head" x="40" y="411" width="124" height="58" rx="0"/><text class="lane" x="102.0" y="436.0" text-anchor="middle" style="font-size:15px">Whisper</text><text x="102.0" y="455.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">on Groq</text><rect class="head" x="176" y="411" width="124" height="58" rx="0"/><text class="lane" x="238.0" y="436.0" text-anchor="middle" style="font-size:15px">Claude API</text><text x="238.0" y="455.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">JSON out</text><path class="arrow back" d="M170.0 380 L170.0 505" marker-end="url(#ah-arch-n)"/><text class="lbl lbl-n" x="182.0" y="494" text-anchor="start" style="font-size:13px">draft + trace</text><rect class="head" x="40" y="509" width="260" height="57" rx="0"/><text class="lane" x="170.0" y="533.5" text-anchor="middle" style="font-size:15px">Postgres + RLS</text><text x="170.0" y="552.5" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">recordings row: “ready”</text><path class="arrow back" d="M170.0 568 L170.0 602" marker-end="url(#ah-arch-n)"/><rect class="head" x="40" y="606" width="260" height="57" rx="0"/><text class="lane" x="170.0" y="630.5" text-anchor="middle" style="font-size:15px">Realtime</text><text x="170.0" y="649.5" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">tells my phone over a WebSocket</text><text x="306" y="640" text-anchor="start" style="font:italic 600 14px var(--font-body);fill:var(--link)">a</text><path class="arrow front" d="M170.0 665 L170.0 699" marker-end="url(#ah-arch-n)"/><text x="156.0" y="688.0" text-anchor="middle" style="font:600 13px var(--font-body);fill:var(--link)">6</text><text class="lbl lbl-n" x="182.0" y="688.0" text-anchor="start" style="font-size:13px">back to my phone</text><rect class="head" x="40" y="703" width="260" height="57" rx="0"/><text class="lane" x="170.0" y="727.5" text-anchor="middle" style="font-size:15px">My phone</text><text x="170.0" y="746.5" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">shows the draft: Send or Delete</text><path class="arrow front" d="M170.0 762 L170.0 796" marker-end="url(#ah-arch-n)"/><text x="156.0" y="785.0" text-anchor="middle" style="font:600 13px var(--font-body);fill:var(--link)">7</text><text class="lbl lbl-n" x="182.0" y="785.0" text-anchor="start" style="font-size:13px">Send; the function pushes</text><rect class="head" x="40" y="800" width="260" height="57" rx="0"/><text class="lane" x="170.0" y="824.5" text-anchor="middle" style="font-size:15px">Push service</text><text x="170.0" y="843.5" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">Apple · Google</text><path class="arrow back" d="M170.0 859 L170.0 893" marker-end="url(#ah-arch-n)"/><rect class="head" x="40" y="897" width="260" height="57" rx="0"/><text class="lane" x="170.0" y="921.5" text-anchor="middle" style="font-size:15px">My wife's phone</text><text x="170.0" y="940.5" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">notification + badge</text><path d="M4 976 H336" style="stroke:var(--rule);stroke-width:1;fill:none"/><text x="4" y="1000" text-anchor="start" style="font:600 13px var(--font-body);fill:var(--ink)">What I changed after reading the guide</text><text x="4" y="1022" text-anchor="start" style="font:italic 600 14px var(--font-body);fill:var(--link)">a</text><text x="22" y="1022" text-anchor="start" style="font:italic 14px var(--font-body);fill:var(--link)">Realtime replaced polling and its</text><text x="22" y="1041" text-anchor="start" style="font:italic 14px var(--font-body);fill:var(--link)">status route.</text><text x="4" y="1063" text-anchor="start" style="font:italic 600 14px var(--font-body);fill:var(--link)">b</text><text x="22" y="1063" text-anchor="start" style="font:italic 14px var(--font-body);fill:var(--link)">The server owns a note once it's</text><text x="22" y="1082" text-anchor="start" style="font:italic 14px var(--font-body);fill:var(--link)">uploaded: a pg_cron sweeper (↻)</text><text x="22" y="1101" text-anchor="start" style="font:italic 14px var(--font-body);fill:var(--link)">retries it, not the phone.</text></g></svg>
