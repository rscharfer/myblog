<svg class="seq seq-ed" viewBox="0 0 720 600" role="img" aria-label="System diagram of Thankful's second version. The phone gets an upload URL from Netlify, uploads the audio to Supabase Storage and starts the process-note Edge Function, which sends the audio to Whisper on Groq and the transcript to the Claude API, then saves a draft. Supabase Realtime tells the phone the draft is ready; on Send, the function pushes a notification to my wife's phone. Two notes mark what I changed: Realtime instead of polling, and a server-side sweeper that owns retries."><defs><marker id="ah-arch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ahd"/></marker></defs><g><text x="94" y="22" text-anchor="middle" style="font:600 11px var(--font-body);letter-spacing:.1em;fill:var(--muted)">MY PHONE</text><text x="360" y="22" text-anchor="middle" style="font:600 11px var(--font-body);letter-spacing:.1em;fill:var(--muted)">NETLIFY + SUPABASE</text><text x="626" y="22" text-anchor="middle" style="font:600 11px var(--font-body);letter-spacing:.1em;fill:var(--muted)">AI · PUSH</text><rect class="head" x="4" y="36" width="180" height="448" rx="0"/><text class="lane" x="94" y="62" text-anchor="middle">Thankful PWA</text><text x="94" y="84" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">records and plays back</text><text x="94" y="101" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">keeps the audio until</text><text x="94" y="118" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">the upload succeeds</text><text x="94" y="400" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">shows the draft:</text><text x="94" y="417" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">Send or Delete</text><rect class="head" x="230" y="36" width="260" height="60" rx="0"/><text class="lane" x="360.0" y="62.0" text-anchor="middle" style="font-size:15px">Netlify</text><text x="360.0" y="81.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">upload route: a signed upload URL</text><rect class="head" x="220" y="112" width="280" height="372" rx="0" style="fill:none;stroke:var(--rule);stroke-dasharray:4 4"/><text class="lane" x="360" y="132" text-anchor="middle">Supabase</text><rect class="head" x="236" y="146" width="118" height="56" rx="0"/><text class="lane" x="295.0" y="170.0" text-anchor="middle" style="font-size:15px">Storage</text><text x="295.0" y="189.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">private bucket</text><rect class="head" x="366" y="146" width="118" height="56" rx="0" style="fill:none;stroke:var(--ink);stroke-dasharray:3 3"/><text class="lane" x="425.0" y="170.0" text-anchor="middle" style="font-size:15px">pg_cron</text><text x="425.0" y="189.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">every 5 minutes</text><rect class="head" x="236" y="228" width="248" height="78" rx="0"/><text class="lane" x="360.0" y="254.0" text-anchor="middle" style="font-size:15px">Edge Function: process-note</text><text x="360.0" y="273.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">claim → transcribe → write up</text><text x="360.0" y="290.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">→ save a draft and a trace</text><rect class="head" x="236" y="332" width="248" height="56" rx="0"/><text class="lane" x="360.0" y="356.0" text-anchor="middle" style="font-size:15px">Postgres + Row Level Security</text><text x="360.0" y="375.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">recordings · messages · days · items</text><rect class="head" x="236" y="414" width="118" height="56" rx="0"/><text class="lane" x="295.0" y="438.0" text-anchor="middle" style="font-size:15px">Realtime</text><text x="295.0" y="457.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">over a WebSocket</text><rect class="head" x="366" y="414" width="118" height="56" rx="0"/><text class="lane" x="425.0" y="438.0" text-anchor="middle" style="font-size:15px">Auth</text><text x="425.0" y="457.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">our two accounts</text><rect class="head" x="536" y="146" width="180" height="56" rx="0"/><text class="lane" x="626.0" y="170.0" text-anchor="middle" style="font-size:15px">Whisper on Groq</text><text x="626.0" y="189.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">audio → timed segments</text><rect class="head" x="536" y="236" width="180" height="56" rx="0"/><text class="lane" x="626.0" y="260.0" text-anchor="middle" style="font-size:15px">Claude API</text><text x="626.0" y="279.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">transcript → JSON</text><rect class="head" x="536" y="332" width="180" height="56" rx="0"/><text class="lane" x="626.0" y="356.0" text-anchor="middle" style="font-size:15px">Push service</text><text x="626.0" y="375.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">Apple · Google</text><rect class="head" x="536" y="414" width="180" height="70" rx="0"/><text class="lane" x="626.0" y="445.0" text-anchor="middle" style="font-size:15px">My wife's phone</text><text x="626.0" y="464.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">notification + badge</text><path class="arrow front" d="M186 66 L226 66" marker-end="url(#ah-arch)" marker-start="url(#ah-arch)"/><text x="206" y="58" text-anchor="middle" style="font:600 13px var(--font-body);fill:var(--link)">1</text><path class="arrow front" d="M186 174 L232 174" marker-end="url(#ah-arch)"/><text x="209" y="166" text-anchor="middle" style="font:600 13px var(--font-body);fill:var(--link)">2</text><path class="arrow front" d="M186 252 L232 252" marker-end="url(#ah-arch)"/><text x="209" y="244" text-anchor="middle" style="font:600 13px var(--font-body);fill:var(--link)">3</text><path class="arrow back" d="M425 204 L425 224" marker-end="url(#ah-arch)" style="stroke-dasharray:3 3"/><path class="arrow back" d="M295 204 L295 224" marker-end="url(#ah-arch)"/><path class="arrow back" d="M486 244 C512 244 508 174 532 174" marker-end="url(#ah-arch)" marker-start="url(#ah-arch)"/><text x="520" y="214" text-anchor="middle" style="font:600 13px var(--font-body);fill:var(--link)">4</text><path class="arrow back" d="M486 266 L532 264" marker-end="url(#ah-arch)" marker-start="url(#ah-arch)"/><text x="509" y="258" text-anchor="middle" style="font:600 13px var(--font-body);fill:var(--link)">5</text><path class="arrow back" d="M360 308 L360 328" marker-end="url(#ah-arch)"/><path class="arrow back" d="M295 390 L295 410" marker-end="url(#ah-arch)"/><path class="arrow front" d="M234 446 L188 446" marker-end="url(#ah-arch)"/><text x="209" y="438" text-anchor="middle" style="font:600 13px var(--font-body);fill:var(--link)">6</text><path class="arrow front" d="M186 290 L232 290" marker-end="url(#ah-arch)"/><text x="209" y="282" text-anchor="middle" style="font:600 13px var(--font-body);fill:var(--link)">7</text><path class="arrow back" d="M486 292 C514 292 508 360 532 360" marker-end="url(#ah-arch)"/><text x="520" y="336" text-anchor="middle" style="font:600 13px var(--font-body);fill:var(--link)">7</text><path class="arrow back" d="M626 390 L626 410" marker-end="url(#ah-arch)"/><text x="330" y="407" text-anchor="middle" style="font:italic 600 14px var(--font-body);fill:var(--link)">a</text><text x="476" y="162" text-anchor="middle" style="font:italic 600 14px var(--font-body);fill:var(--link)">b</text><path class="arrow front" d="M4 500 H34"/><text x="40" y="504" text-anchor="start" style="font:13px var(--font-body);fill:var(--muted)">to or from my phone</text><path class="arrow back" d="M190 500 H220"/><text x="226" y="504" text-anchor="start" style="font:13px var(--font-body);fill:var(--muted)">between servers</text><path d="M4 516 H716" style="stroke:var(--rule);stroke-width:1;fill:none"/><text x="4" y="536" text-anchor="start" style="font:600 13px var(--font-body);fill:var(--ink)">What I changed after reading the guide</text><text x="4" y="560" text-anchor="start" style="font:italic 14px var(--font-body);fill:var(--link)">a  The record screen hears “ready” through Realtime; I removed the polling and its status route.</text><text x="4" y="584" text-anchor="start" style="font:italic 14px var(--font-body);fill:var(--link)">b  The server owns a note once it’s uploaded: retries moved off the phone into a pg_cron sweeper.</text></g></svg>
