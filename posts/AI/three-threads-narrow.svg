<svg class="seq seq-ed seq-narrow" viewBox="0 0 340 548" role="img" aria-label="Diagram: three Claude sessions. Product puts decisions into the product spec, a Claude doc; Implementation builds from it and commits the code to the git repo; Design review reads the repo."><defs><marker id="ah-tt-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ahd"/></marker></defs><g><rect class="head" x="70" y="6" width="200" height="88" rx="0" style="fill:var(--code-bg);stroke:var(--ink);stroke-width:1"/><text x="170.0" y="35.0" text-anchor="middle" style="font:600 10.5px var(--font-body);letter-spacing:.1em;fill:var(--muted)">CLAUDE SESSION</text><text class="lane" x="170.0" y="58.0" text-anchor="middle">Product</text><text x="170.0" y="78.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">what to build, and when</text><path class="arrow back" d="M170 96 L170 138" marker-end="url(#ah-tt-n)"/><text class="lbl lbl-n" x="180" y="122" text-anchor="start">decisions go in</text><rect class="head" x="10" y="142" width="320" height="88" rx="0" style="fill:var(--paper);stroke:var(--link);stroke-width:1.6"/><text x="170.0" y="171.0" text-anchor="middle" style="font:600 10.5px var(--font-body);letter-spacing:.1em;fill:var(--link)">CLAUDE DOC</text><text class="lane" x="170.0" y="194.0" text-anchor="middle">Product spec</text><text x="170.0" y="214.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">scope · decision log · open questions</text><path class="arrow back" d="M82 232 L82 282" marker-end="url(#ah-tt-n)"/><text class="lbl lbl-n" x="92" y="262" text-anchor="start">builds from</text><rect class="head" x="2" y="286" width="160" height="88" rx="0" style="fill:var(--code-bg);stroke:var(--ink);stroke-width:1"/><text x="82.0" y="315.0" text-anchor="middle" style="font:600 10.5px var(--font-body);letter-spacing:.1em;fill:var(--muted)">CLAUDE SESSION</text><text class="lane" x="82.0" y="338.0" text-anchor="middle">Implementation</text><text x="82.0" y="358.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">writes the code</text><path class="arrow back" d="M82 376 L82 418" marker-end="url(#ah-tt-n)"/><text class="lbl lbl-n" x="92" y="402" text-anchor="start">commits</text><rect class="head" x="2" y="422" width="150" height="106" rx="0" style="fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:5 4"/><text x="77.0" y="460.0" text-anchor="middle" style="font:600 10.5px var(--font-body);letter-spacing:.1em;fill:var(--muted)">GIT REPO</text><text x="77.0" y="483.0" text-anchor="middle" style="font:500 15px var(--font-mono);fill:var(--ink)">repo/</text><text x="77.0" y="503.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">the code itself</text><path class="arrow back" d="M154 475 L196 475" marker-end="url(#ah-tt-n)"/><text class="lbl lbl-n" x="175" y="465" text-anchor="middle">reads</text><rect class="head" x="200" y="422" width="138" height="106" rx="0" style="fill:var(--code-bg);stroke:var(--ink);stroke-width:1"/><text x="269.0" y="451.0" text-anchor="middle" style="font:600 10.5px var(--font-body);letter-spacing:.1em;fill:var(--muted)">CLAUDE SESSION</text><text class="lane" x="269.0" y="474.0" text-anchor="middle">Design review</text><text x="269.0" y="494.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">explains the code;</text><text x="269.0" y="512.0" text-anchor="middle" style="font:13px var(--font-body);fill:var(--muted)">I push back</text></g></svg>
