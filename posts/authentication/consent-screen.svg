<svg viewBox="0 0 600 372" role="img" aria-label="Sketch of a consent screen. YourFavoriteApp wants to access your Google Account. This will allow YourFavoriteApp to see and download your contacts and send email on your behalf. Buttons: Cancel and Allow." xmlns="http://www.w3.org/2000/svg">
  <rect x="0.5" y="0.5" width="599" height="371" style="fill:var(--paper);stroke:var(--rule)"/>
  <rect x="0.5" y="0.5" width="599" height="36" style="fill:var(--code-bg);stroke:var(--rule)"/>
  <circle cx="20" cy="18.5" r="4" style="fill:var(--rule)"/>
  <circle cx="34" cy="18.5" r="4" style="fill:var(--rule)"/>
  <circle cx="48" cy="18.5" r="4" style="fill:var(--rule)"/>
  <text x="300" y="23" text-anchor="middle" style="font:13px var(--font-mono);fill:var(--muted)">accounts.google.com</text>

  <text x="40" y="84" style="font:600 22px var(--font-display);fill:var(--ink)">YourFavoriteApp wants to access</text>
  <text x="40" y="112" style="font:600 22px var(--font-display);fill:var(--ink)">your Google Account</text>

  <rect x="40" y="130" width="196" height="30" rx="15" style="fill:none;stroke:var(--rule)"/>
  <circle cx="57" cy="145" r="9" style="fill:var(--muted)"/>
  <text x="74" y="150" style="font:14px var(--font-body);fill:var(--ink)">jane.doe@example.com</text>

  <text x="40" y="196" style="font:15px var(--font-body);fill:var(--ink)">This will allow YourFavoriteApp to:</text>
  <line x1="40" y1="212" x2="560" y2="212" style="stroke:var(--rule)"/>
  <rect x="40" y="225" width="18" height="18" style="fill:none;stroke:var(--muted)"/>
  <text x="72" y="239" style="font:15px var(--font-body);fill:var(--ink)">See and download your contacts</text>
  <line x1="40" y1="256" x2="560" y2="256" style="stroke:var(--rule)"/>
  <rect x="40" y="269" width="18" height="18" style="fill:none;stroke:var(--muted)"/>
  <text x="72" y="283" style="font:15px var(--font-body);fill:var(--ink)">Send email on your behalf</text>
  <line x1="40" y1="300" x2="560" y2="300" style="stroke:var(--rule)"/>

  <text x="40" y="340" style="font:13px var(--font-body);fill:var(--muted)">Make sure you trust YourFavoriteApp.</text>
  <text x="430" y="340" text-anchor="middle" style="font:500 15px var(--font-body);fill:var(--link)">Cancel</text>
  <rect x="470" y="317" width="90" height="36" style="fill:var(--ink)"/>
  <text x="515" y="340" text-anchor="middle" style="font:500 15px var(--font-body);fill:var(--paper)">Allow</text>
</svg>
