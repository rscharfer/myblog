<svg class="seq seq-ed seq-narrow" viewBox="0 0 340 536" role="img" aria-label="Sequence diagram of the PKCE authorization code flow between browser, app server and authorization server"><defs><marker id="ah-ed-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ahd"/></marker></defs><g><rect class="head" x="2" y="14" width="100" height="34" rx="0"/><text class="lane lane-n" x="52" y="36" text-anchor="middle">Browser</text><path class="life" d="M52 48 V528"/><rect class="head" x="120" y="14" width="100" height="34" rx="0"/><text class="lane lane-n" x="170" y="36" text-anchor="middle">App server</text><path class="life" d="M170 48 V528"/><rect class="head" x="238" y="14" width="100" height="34" rx="0"/><text class="lane lane-n" x="288" y="36" text-anchor="middle">Auth server</text><path class="life" d="M288 48 V528"/><rect class="note" x="28.400000000000006" y="92" width="283.2" height="30" rx="0"/><text class="lbl lbl-n" x="170.0" y="112" text-anchor="middle">1 · make verifier → hash → challenge</text><path class="arrow front" d="M56 168 L282 168" marker-end="url(#ah-ed-n)"/><text class="lbl lbl-n" x="170.0" y="159" text-anchor="middle">2 · redirect ?code_challenge=…</text><rect class="note" x="115.6" y="204" width="218.4" height="30" rx="0"/><text class="lbl lbl-n" x="224.8" y="224" text-anchor="middle">3 · user logs in + consents</text><path class="arrow front" d="M284 280 L58 280" marker-end="url(#ah-ed-n)"/><text class="lbl lbl-n" x="170.0" y="271" text-anchor="middle">4 · redirect back ?code=…</text><path class="arrow front" d="M56 336 L164 336" marker-end="url(#ah-ed-n)"/><text class="lbl lbl-n" x="111.0" y="327" text-anchor="middle">5 · GET /callback?code=…</text><path class="arrow back" d="M174 392 L282 392" marker-end="url(#ah-ed-n)"/><text class="lbl lbl-n" x="229.0" y="383" text-anchor="middle">6 · code + code_verifier</text><rect class="note" x="58.0" y="428" width="276.0" height="30" rx="0"/><text class="lbl lbl-n" x="196.0" y="448" text-anchor="middle">7 · SHA-256(verifier) == challenge?</text><path class="arrow ok" d="M284 504 L176 504" marker-end="url(#ah-ed-n)"/><text class="lbl lbl-n" x="229.0" y="495" text-anchor="middle">8 · access_token</text></g></svg>
