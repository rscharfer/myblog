<svg class="seq seq-ed" viewBox="0 0 720 496" role="img" aria-label="Sequence diagram of the PKCE authorization code flow between browser, app server and authorization server"><defs><marker id="ah-ed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ahd"/></marker></defs><g><rect class="head" x="14" y="40" width="192" height="40" rx="0"/><text class="lane" x="110" y="65" text-anchor="middle">Browser</text><path class="life" d="M110 80 V486"/><rect class="head" x="264" y="40" width="192" height="40" rx="0"/><text class="lane" x="360" y="65" text-anchor="middle">App server</text><path class="life" d="M360 80 V486"/><rect class="head" x="514" y="40" width="192" height="40" rx="0"/><text class="lane" x="610" y="65" text-anchor="middle">Authorization server</text><path class="life" d="M610 80 V486"/><rect class="note" x="180.0" y="122" width="360" height="30" rx="0"/><text class="lbl" x="360.0" y="142" text-anchor="middle">1 · make code_verifier → hash it → code_challenge</text><path class="arrow front" d="M114 188 L604 188" marker-end="url(#ah-ed)"/><text class="lbl" x="360.0" y="179" text-anchor="middle">2 · redirect ?code_challenge=…&amp;method=S256</text><rect class="note" x="422" y="214" width="290" height="30" rx="0"/><text class="lbl" x="567.0" y="234" text-anchor="middle">3 · user logs in + consents</text><path class="arrow front" d="M606 280 L116 280" marker-end="url(#ah-ed)"/><text class="lbl" x="360.0" y="271" text-anchor="middle">4 · redirect back ?code=…</text><path class="arrow front" d="M114 326 L354 326" marker-end="url(#ah-ed)"/><text class="lbl" x="235.0" y="317" text-anchor="middle">5 · GET /callback?code=…</text><path class="arrow back" d="M364 372 L604 372" marker-end="url(#ah-ed)"/><text class="lbl" x="485.0" y="363" text-anchor="middle">6 · code + code_verifier</text><rect class="note" x="422" y="398" width="290" height="30" rx="0"/><text class="lbl" x="567.0" y="418" text-anchor="middle">7 · SHA-256(verifier) == challenge ?</text><path class="arrow ok" d="M606 464 L366 464" marker-end="url(#ah-ed)"/><text class="lbl" x="485.0" y="455" text-anchor="middle">8 · access_token</text></g></svg>
