<!doctype html>
<!-- Open Graph card for posts/authentication/authorization-code-flow.md. Render to
     public/og/authentication/authorization-code-flow.png with the command in README.md ("Open Graph images").
     Colours and fonts are the light theme in styles/blog.css; the header and footer match PKCE.html. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:"Bricolage Grotesque";src:url(../../styles/fonts/bricolage-grotesque.woff2) format("woff2");font-weight:200 800}
  @font-face{font-family:Figtree;src:url(../../styles/fonts/figtree.woff2) format("woff2");font-weight:300 900}
  :root{--paper:#fdfcfa;--ink:#1c1b19;--muted:#68645d;--rule:#e6e1d8;--link:#9a3412;--code-bg:#f5f2ec;
    --font-display:"Bricolage Grotesque",system-ui,sans-serif;--font-body:Figtree,system-ui,sans-serif}
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-body);padding:56px 72px 0;display:flex;flex-direction:column}
  .bar{width:40px;border-top:2px solid var(--ink);margin-bottom:20px}
  .kicker{font:600 15px/1.3 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--link)}
  h1{font:650 64px/1.04 var(--font-display);letter-spacing:-.025em;margin-top:14px}
  .sub{font:400 26px/1.35 var(--font-display);color:var(--muted);margin-top:12px}

  /* Ticket -> key -> open padlock */
  .story{display:grid;grid-template-columns:230px 1fr 230px 1fr 230px;align-items:end;margin-top:44px}
  .thing{display:flex;flex-direction:column;align-items:center;gap:4px}
  .thing svg{height:146px;width:auto;margin-bottom:12px;overflow:visible}
  .thing b{font:650 24px/1.1 var(--font-display);letter-spacing:-.01em}
  .thing span{font-size:17px;color:var(--muted)}
  .arrow{align-self:center;margin-bottom:52px;padding:0 6px}
  .arrow p{font:500 19px/1.2 var(--font-body);text-align:center;margin-bottom:10px;white-space:nowrap}
  .arrow .line{height:0;border-top:2px solid var(--ink);margin-right:10px;position:relative}
  .arrow .line::after{content:"";position:absolute;right:-12px;top:-7px;border-left:12px solid var(--ink);border-top:6px solid transparent;border-bottom:6px solid transparent}
  .arrow.back .line{border-color:var(--link)}
  .arrow.back .line::after{border-left-color:var(--link)}

  footer{margin-top:auto;border-top:1px solid var(--rule);display:flex;align-items:center;height:72px;font-size:18px}
  footer span{color:var(--muted)}
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="kicker">Authentication · OAuth</div>
  <h1>Trade the ticket for the key.</h1>
  <p class="sub">How “Sign in with Google” works, in one picture</p>

  <div class="story">
    <div class="thing">
      <!-- Claim ticket: notched sides and a perforation -->
      <svg viewBox="0 0 200 130" aria-hidden="true">
        <path d="M8 18H192V50A15 15 0 0 0 192 80V112H8V80A15 15 0 0 0 8 50Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M62 28V102" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round"/>
        <text x="128" y="73" text-anchor="middle" font-family="Figtree" font-weight="700" font-size="21" letter-spacing="3" fill="var(--ink)">CODE</text>
      </svg>
      <b>Authorization code</b><span>a one-time claim ticket</span>
    </div>

    <div class="arrow back"><p>trade it for</p><div class="line"></div></div>

    <div class="thing">
      <!-- Key, in the accent colour -->
      <svg viewBox="0 0 220 130" aria-hidden="true">
        <g fill="none" stroke="var(--link)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="46" cy="65" r="30"/>
          <circle cx="46" cy="65" r="9"/>
          <path d="M76 65H208M184 65V90M160 65V84"/>
        </g>
      </svg>
      <b>Access token</b><span>the key</span>
    </div>

    <div class="arrow"><p>use it on</p><div class="line"></div></div>

    <div class="thing">
      <!-- Open padlock: the left leg of the shackle is lifted out of the body -->
      <svg viewBox="0 0 180 200" aria-hidden="true">
        <path d="M128 92V52A40 40 0 0 0 48 52V66" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
        <rect x="18" y="92" width="144" height="104" fill="var(--paper)" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/>
        <text x="90" y="159" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="40" letter-spacing="1" fill="var(--ink)">API</text>
      </svg>
      <b>Google API</b><span>the user’s data</span>
    </div>
  </div>

  <footer><span>ryanscharfer.blog</span></footer>
</body>
</html>
