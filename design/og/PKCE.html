<!doctype html>
<!-- Open Graph card for posts/authentication/PKCE.md. Render to public/og/authentication/PKCE.png
     with the command in README.md ("Open Graph images"). Colours and fonts are the light theme in styles/blog.css. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:"Bricolage Grotesque";src:url(../../styles/fonts/bricolage-grotesque.woff2) format("woff2");font-weight:200 800}
  @font-face{font-family:Figtree;src:url(../../styles/fonts/figtree.woff2) format("woff2");font-weight:300 900}
  :root{--paper:#fdfcfa;--ink:#1c1b19;--muted:#68645d;--rule:#e6e1d8;--link:#9a3412;--code-bg:#f5f2ec;
    --font-display:"Bricolage Grotesque",system-ui,sans-serif;--font-body:Figtree,system-ui,sans-serif}
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-body);padding:56px 72px 0;display:flex;flex-direction:column}
  .bar{width:40px;border-top:2px solid var(--ink);margin-bottom:20px}
  .kicker{font:600 15px/1.3 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--link)}
  h1{font:650 64px/1.04 var(--font-display);letter-spacing:-.025em;margin-top:14px}
  .sub{font:400 26px/1.35 var(--font-display);color:var(--muted);margin-top:12px}

  .flow{display:grid;grid-template-columns:270px 1fr 270px;align-items:center;margin-top:44px}
  .box{border:1px solid var(--ink);height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .box svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:2px}
  .box b{font:650 26px/1.1 var(--font-display);letter-spacing:-.01em}
  .box span{font-size:17px;color:var(--muted)}
  .arrows{display:flex;flex-direction:column;gap:34px;padding:0 4px}
  .arrow{position:relative}
  .arrow p{font:500 19px/1.2 var(--font-body);text-align:center;white-space:nowrap}
  .arrow p strong{font-weight:700}
  .arrow .line{height:0;border-top:2px solid var(--ink);margin:10px 10px 0 0;position:relative}
  .arrow .line::after{content:"";position:absolute;right:-12px;top:-7px;border-left:12px solid var(--ink);border-top:6px solid transparent;border-bottom:6px solid transparent}
  .arrow.two .line{border-top-style:dashed;border-color:var(--link)}
  .arrow.two .line::after{border-left-color:var(--link)}
  .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--link);color:var(--link);font:700 13px var(--font-body);margin-right:8px;vertical-align:2px}

  .result{text-align:center;font:400 21px/1.4 var(--font-body);margin-top:34px}
  .result .to{color:var(--link);margin:0 8px}
  footer{margin-top:auto;border-top:1px solid var(--rule);display:flex;align-items:center;height:72px;font-size:18px}
  footer span{color:var(--muted)}
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="kicker">Authentication · PKCE</div>
  <h1>Hash first. Reveal later.</h1>
  <p class="sub">PKCE in one picture</p>

  <div class="flow">
    <div class="box">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M17 12v3.5M20 12v2.5"/></svg>
      <b>Your app</b><span>makes a secret</span>
    </div>
    <div class="arrows">
      <div class="arrow one"><p><span class="n">1</span>send the <strong>hash</strong> of the secret</p><div class="line"></div></div>
      <div class="arrow two"><p><span class="n">2</span>later, send the <strong>secret</strong> itself</p><div class="line"></div></div>
    </div>
    <div class="box">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.8 3.5-6 7-6s6.2 2.2 7 6"/></svg>
      <b>Google</b><span>login server</span>
    </div>
  </div>

  <p class="result">Hashes match<span class="to">→</span>same client<span class="to">→</span>here’s your access token.</p>

  <footer><span>ryanscharfer.blog</span></footer>
</body>
</html>
